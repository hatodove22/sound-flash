<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Sound Flash</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #000;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow: hidden;
    }
    #flash { position: fixed; inset: 0; background: #000; }
    #settings {
      position: fixed; inset: 0; display: grid; place-items: center;
      padding: 20px; background: rgba(0,0,0,.72);
    }
    .panel {
      width: min(92vw, 420px); padding: 20px; border-radius: 16px;
      background: rgba(28,28,32,.96); color: #fff;
    }
    h1 { margin: 0 0 8px; font-size: 22px; }
    p { margin: 0 0 18px; color: #bbb; font-size: 14px; line-height: 1.5; }
    .item { margin: 16px 0; }
    .labelrow { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:8px; }
    input[type="color"] { width:64px; height:42px; border:0; padding:0; background:none; }
    input[type="range"] { width:100%; }
    button {
      width:100%; min-height:54px; margin-top:10px; border:0; border-radius:12px;
      background:#fff; color:#000; font-size:18px; font-weight:700;
    }
    #status { margin-top:12px; color:#aaa; font-size:12px; line-height:1.5; }
  </style>
</head>
<body>
  <div id="flash"></div>
  <div id="settings">
    <div class="panel">
      <h1>Sound Flash</h1>
      <p>声の大きさに合わせて画面全体を発光させます。</p>
      <div class="item">
        <div class="labelrow"><label for="color">色</label><input id="color" type="color" value="#ff2020"></div>
      </div>
      <div class="item">
        <div class="labelrow"><label for="gain">感度</label><span id="gainValue">12</span></div>
        <input id="gain" type="range" min="1" max="30" step="1" value="12">
      </div>
      <div class="item">
        <div class="labelrow"><label for="gate">ノイズゲート</label><span id="gateValue">0.010</span></div>
        <input id="gate" type="range" min="0" max="0.08" step="0.002" value="0.010">
      </div>
      <button id="start">START</button>
      <div id="status">START後にマイク使用を許可してください。発光中は画面を3回タップすると設定に戻ります。</div>
    </div>
  </div>
  <script>
    const flash=document.getElementById("flash");
    const settings=document.getElementById("settings");
    const color=document.getElementById("color");
    const gain=document.getElementById("gain");
    const gate=document.getElementById("gate");
    const gainValue=document.getElementById("gainValue");
    const gateValue=document.getElementById("gateValue");
    const startButton=document.getElementById("start");
    const status=document.getElementById("status");
    let audioContext,stream,analyser,samples,running=false,brightness=0;

    gain.addEventListener("input",()=>gainValue.textContent=gain.value);
    gate.addEventListener("input",()=>gateValue.textContent=Number(gate.value).toFixed(3));

    function hexToRgb(hex){
      return {r:parseInt(hex.slice(1,3),16),g:parseInt(hex.slice(3,5),16),b:parseInt(hex.slice(5,7),16)};
    }
    function setBrightness(level){
      level=Math.max(0,Math.min(1,level));
      const c=hexToRgb(color.value);
      flash.style.background=`rgb(${Math.round(c.r*level)},${Math.round(c.g*level)},${Math.round(c.b*level)})`;
    }
    async function start(){
      try{
        stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
        audioContext=new (window.AudioContext||window.webkitAudioContext)();
        await audioContext.resume();
        const source=audioContext.createMediaStreamSource(stream);
        analyser=audioContext.createAnalyser();
        analyser.fftSize=1024;
        analyser.smoothingTimeConstant=0;
        source.connect(analyser);
        samples=new Float32Array(analyser.fftSize);
        settings.style.display="none";
        running=true;
        brightness=0;
        animate();
      }catch(e){
        status.textContent="マイクを開始できませんでした。マイク権限とHTTPS接続を確認してください。";
      }
    }
    function animate(){
      if(!running)return;
      analyser.getFloatTimeDomainData(samples);
      let sum=0;
      for(let i=0;i<samples.length;i++)sum+=samples[i]*samples[i];
      const rms=Math.sqrt(sum/samples.length);
      let target=Math.max(0,rms-Number(gate.value))*Number(gain.value);
      target=Math.min(1,target);
      const smoothing=target>brightness?0.85:0.25;
      brightness+=(target-brightness)*smoothing;
      setBrightness(brightness);
      requestAnimationFrame(animate);
    }
    async function stop(){
      running=false;
      setBrightness(0);
      if(stream)stream.getTracks().forEach(t=>t.stop());
      if(audioContext)await audioContext.close();
      settings.style.display="grid";
    }
    startButton.addEventListener("click",start);
    let tapCount=0,tapTimer;
    flash.addEventListener("pointerup",()=>{
      if(!running)return;
      tapCount++;
      clearTimeout(tapTimer);
      tapTimer=setTimeout(()=>tapCount=0,700);
      if(tapCount>=3){tapCount=0;stop();}
    });
  </script>
</body>
</html>
